name: Android Build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Unzip Project
        run: unzip -o NONxKILL-LOADER.zip

      - name: Build APK
        run: |
          cd NONxKILL-LOADER/NONxKILL-LOADER
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: NONxKILL-LOADER/NONxKILL-LOADER/app/build/outputs/apk/debug/*.apk
